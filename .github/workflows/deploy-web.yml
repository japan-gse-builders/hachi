```yaml
name: Deploy web

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build web
        run: npm run build --workspace=apps/web

      - name: Deploy to Firebase
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: >-
          npx --yes firebase-tools@15 deploy
          --only hosting,firestore
          --project "$FIREBASE_PROJECT_ID"
          --non-interactive
          --message "${GITHUB_SHA::7} ${GITHUB_RUN_ID}"

      - name: Verify live site
        run: |
          set -e
          curl -fsS --retry 5 --retry-delay 10 \
            -H 'Cache-Control: no-cache' \
            https://hachicall.web.app/ \
            -o /tmp/live-index.html

          if ! grep -q '<html' /tmp/live-index.html; then
            echo "::error::The live site did not return the expected HTML"
            exit 1
          fi

          echo "Live site is responding: https://hachicall.web.app/"
```
